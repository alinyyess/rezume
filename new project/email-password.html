<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldAI</title>
    <link rel="stylesheet" href="email-password.css">
</head>
<body>
    
      <div class="block1">
        <img class="logo" src="ShieldAI Central Logo 1.png" alt="centrallogo" width="128" height="128">
        <div class="bigTitle">ShieldAI</div>
        <div class="subtitle">Protective Intelligence</div>
      </div>

      <div class="block2">
        <div class="email">Email Address</div>
        <div class="emailinput">
          <img class="miniemailletter" src="letter2.png" alt="letter" width="20" height="16">
          <input type="text" class="inputemail">
        </div>
        <div class="passwords">
            <div class="password">Password</div>
            <div class="forgotp">Forgot password?</div>
        </div>
        <div class="passwordinput">
          <img class="minilocker" src="minilocker.png" alt="locker" width="16" height="23.52">
          <input type="text" class="inputpassword">
          <img class="minieye" src="minieye.png" alt="eye" width="22" height="16.63">
        </div>
        <button class="login">Log in</button>
        <img class="newminiarrow" src="newminiarrow.png" alt="strelka" width="16" height="16">
        <div class="orcontinue"><hr>Or continue with<hr></div>
        <div class="twobuttons">
          <button class="apple">Apple</button>
          <button class="google">Google</button>
        </div>
        
      </div>
      <div class="question">Don't have an account? <a class="signup"   href="register.html">Sign Up</a></div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShieldAI</title>
    <link rel="stylesheet" href="editing.css">
</head>
<body>
    
     <header>
        <div class="headerblock1">
            <div class="rowheader">
                <div class="menegerc">Менеджер контента</div>
                <img class="arrow" src="strelkaediting.png" alt="strelka" width="4.32" height="7">
                <div class="novayapub">Новая публикация</div>
            </div>
            <div class="rowheader2">
                <div class="sozdaniepub">Создание публикации</div>
                <div class="chernovic">Черновик</div>
            </div>
        </div>
        <div class="headerblock2">
            <button class="savechernovic">Сохранить черновик</button>
            <button class="opublicovat"> <img class="buttonpic" src="publicovat.png" alt="picbutton" width="9.33" height="9.33">Опубликовать</button>
        </div>
     </header>

     <div class="main">
        <div class="bigblock">
            <div class="titlebb">Введите заголовок публикации...</div>
            <div class="subtitlebb">Начните писать здесь...</div>
        </div>
        <div class="smallblocks">
            <div class="novostb">
                <div class="titlenovostb">Метаданные: Новость</div>
                <div class="novostrow">
                    <div class="tema">
                        <div class="temanovosti">Тема новости</div>
                        <input type="text" class="nazvanie" placeholder="Название...">
                    </div>
                    <div class="categoryr">
                        <div class="category">Категория</div>
                        <input type="text" class="vveditecat" placeholder="Введите категорию">
                    </div>
                </div>
                <div class="datapub">Дата публикации</div>
                <input type="text" class="mmddyyyy" placeholder="dd/mm/yyyy">
                <div class="oblozhka">Обложка</div>
                <img class="zagoblnovosti" src="oblnovosti.png" alt="oblnovosti" width="441.33" height="66"

            </div>
            <div class="statiib">
                <div class="titlestatiib">Метаданные: Статьи</div>
                <div class="nazvaniestatii">Название статьи</div>
                <input type="text" class="vveditenaz" placeholder="Введите название...">
                <div class="statiirow">
                    <div class="time">
                        <div class="dlitelnost">Длительность</div>
                        <input type="number" class="minutes" placeholder="5">
                    </div>
                    <div class="author">
                        <div class="nameauthor">Имя автора</div>
                        <input type="text" class="namewrite" placeholder="Иван Иванов">
                    </div>
                </div>
                <div class="statiirow2">
                    <div class="authorph">
                        <div class="photoauthor">Фото автора</div>
                        <div class="photoandbutton">
                            <img class="photo" src="photoauthor.png" alt="photo" width="40" height="40">
                            <button class="zagruzitphotoau">Загрузить</button>
                        </div>
                    </div>
                    <div class="obl">
                        <div class="obltitle">Обложка</div>
                        <img class="zagoblstatii" src="oblstatii.png" alt="zagobl" width="212.67" height="25">
                    </div>
                </div>
            </div>
        </div>
     </div>

</body>
</html>
